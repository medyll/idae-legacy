services:
  # Une seule image applicative : Apache/PHP **et** le serveur socket.io node
  # tournent dans ce conteneur, sous supervisord (config/supervisor/supervisord.conf).
  #
  # Avant (jusqu'au 2026-09-12) il y avait un second service `socket` sur
  # node:20-slim, qui refaisait `npm install` à chaque démarrage, publiait son
  # propre port 3005, et obligeait l'app à l'attendre via wait-for-socket.sh.
  # Tout ça a disparu : les deps node sont installées au build, node écoute sur
  # 127.0.0.1:3005 et n'est joignable que par le reverse proxy Apache.
  app:
    build: .
    ports:
      # Dual-stack. Windows resolves "localhost" to ::1 before 127.0.0.1, and
      # nothing answered there: measured 21s of SYN retries before the fallback.
      # HTTP survives it via the browser's Happy Eyeballs race. Hosts-file names
      # (*.lan) never hit this, that file being IPv4 only.
      #
      # NOTE: the [::] line is inert under Docker Desktop + WSL2 mirrored
      # networking (measured 2026-08-10: `docker port` reports [::]:8080, yet
      # `curl --ipv6` still times out at 21s and the host has no listener at
      # all — the WSL relay does not forward ::1). Kept because it is correct
      # and does work on a Linux host; it is not the fix on this machine. For
      # local dev on Windows, browse a *.lan name or 127.0.0.1, never
      # "localhost".
      #
      # socket.io n'a plus de port publié : il passe par ce même 8080, en
      # same-origin, sur /socket.io/.
      - "8080:80"
      - "[::]:8080:80"
    volumes:
      - ./idae:/var/www/html/idae
      # Le bind-mount ci-dessus recouvre app_node : ce volume anonyme protège le
      # node_modules installé au build (l'hôte est en pnpm/Windows, ses symlinks
      # ne survivent pas dans le conteneur Linux).
      - /var/www/html/idae/web/app_node/node_modules
      - ./logs:/var/log/apache2
      - ./logs:/logs
    depends_on:
      - mongo-test
    env_file:
      # PORT / MONGO_USER / MONGO_PASS / MONGO_DB / NODE_ENV du serveur socket.
      # Aucune de ces clés n'est lue par PHP (PHP lit MDB_* / MONGO_HOST /
      # MONGO_ENV / MONGO_TEST_DSN), et `environment:` ci-dessous gagne sur
      # env_file en cas de doublon.
      - ./idae/web/app_node/.env
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
      - CONF_INC=/var/www/html/idae/web/conf.inc.php
      - DOCKER_ENV=1
      - MONGO_HOST=host.docker.internal
      - MONGO_HOST_PORT=27017
      - MDB_USER=${MDB_USER:-}
      - MDB_PASSWORD=${MDB_PASSWORD:-}
      - MDB_PREFIX=${MDB_PREFIX:-}
      - MONGO_ENV=${MONGO_ENV:-dev}
      - MONGO_TEST_HOST=mongo-test
      - MONGO_TEST_PORT=27017
      - MONGO_TEST_DSN=mongodb://mongo-test:27017
      - DEBUG_DB=
      - DEBUG_SESSION=
      - SOCKET_PORT=3005
      # Le bridge PHP du serveur socket tape sur Apache : même conteneur
      # désormais, donc loopback (avant : nom de service `idae-legacy`).
      - PHP_BRIDGE_HOST=127.0.0.1
      - LOG_DIR=/logs
    container_name: idae-legacy
    healthcheck:
      # Les deux process, pas seulement Apache : supervisord peut très bien
      # servir du PHP pendant que node crash-loop.
      # NB: DocumentRoot = idae/web, donc l'URL est /check_mongo.php (l'ancien
      # /idae/web/check_mongo.php renvoyait 404).
      test: ["CMD-SHELL", "curl -fsS -m 3 http://127.0.0.1/check_mongo.php > /dev/null && curl -fsS -m 3 http://127.0.0.1:3005/health > /dev/null"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Isolated MongoDB instance for PHPUnit tests.
  # Never receives production data. No auth required (test-only).
  mongo-test:
    image: mongo:7
    container_name: idae-mongo-test
    ports:
      - "27018:27017"
    tmpfs:
      - /data/db
    restart: "no"

# socket.io reverse proxy — same-origin.
#
# The socket server now runs inside this container (supervisord program
# "socket", 127.0.0.1:3005) and is NOT published on the host. The browser
# reaches it through this vhost, on the page's own origin, at /socket.io/.
#
# What this removes:
#  - the second published port (3005/3006) and its dual-stack [::] workaround;
#  - the CORS allow-list in app_node/src/main.js (same origin now);
#  - the `document.domain` port-guessing switch in the client JS, and with it
#    the localhost/::1 21s-SYN-retry trap documented in CLAUDE.md — the socket
#    rides whatever host the page was already loaded from, cookie jar included.
#
# `upgrade=websocket` on an http:// ProxyPass (Apache >= 2.4.47; bookworm ships
# 2.4.62) covers both socket.io transports with one directive: the XHR-polling
# handshake goes over plain HTTP, and the later Upgrade request is tunnelled.
# Requires mod_proxy, mod_proxy_http, mod_proxy_wstunnel.
#
# ProxyPreserveHost On: handlers.js joins a room named after
# `socket.handshake.headers.host`, and PHP pushes to that same domain. Keeping
# the browser's Host makes both sides agree.

ProxyRequests Off
ProxyPreserveHost On

ProxyPass        /socket.io/ http://127.0.0.1:3005/socket.io/ upgrade=websocket
ProxyPassReverse /socket.io/ http://127.0.0.1:3005/socket.io/

; Apache and the socket.io server share one container (merged 2026-09-12, was
; two compose services: `app` + `socket` on node:20-slim). supervisord is what
; makes that safe: PID 1 supervises both, restarts either one on its own, and
; a dead node process no longer needs a second image to come back.
;
; Ordering: `socket` has the lower priority number so it starts first, but
; nothing blocks on it — the old `wait-for-socket.sh` gate is gone. Apache only
; needs node at request time (reverse proxy, see config/apache/socketio.conf),
; and the PHP bridge calls retry on their own.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; Socket de contrôle : sans ces trois sections, `docker exec idae-legacy
; supervisorctl status` ne peut pas se connecter (utile pour redémarrer le
; serveur socket seul, sans recréer le conteneur).
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:socket]
command=node src/main.js
directory=/var/www/html/idae/web/app_node
priority=10
autostart=true
autorestart=true
startretries=10
startsecs=3
stopsignal=TERM
stopwaitsecs=15
; Node's own winston transports already write to $LOG_DIR (/logs). These two
; catch what bypasses winston: boot crashes, unhandled rejections, raw stderr.
stdout_logfile=/var/log/apache2/socket-stdout.log
stderr_logfile=/var/log/apache2/socket-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:apache2]
command=apache2-foreground
priority=20
autostart=true
autorestart=true
startretries=5
; WINCH is Apache's graceful-stop signal; TERM kills in-flight requests.
stopsignal=WINCH
stopwaitsecs=15
; Apache's own access/error logs land in /var/log/apache2 (bind-mounted). Only
; the foreground wrapper's chatter goes to the container stdout.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
